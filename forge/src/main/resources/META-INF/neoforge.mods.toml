modLoader="javafml" 
loaderVersion="[4,)"
license="All rights reserved"
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]] 
modId="${mod_id}"
version="${mod_version}" 
 
displayName="${mod_name}"
authors="${mod_author}"
description='''
Allows easy customization of villager trades using datapacks
'''

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="[21,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,)"
    ordering="NONE"
    side="BOTH"
